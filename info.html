<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Engineering Crew - StudyVerse by Dipak</title>
  <meta name="description" content="Meet the leadership, architects and core framework engineers powering StudyVerse platform operations.">
  <meta name="author" content="Dipak R Solanki">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col">
 
  <header id="global-navbar"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-12">
    <div class="text-center space-y-3 mb-16">
      <h2 class="text-4xl font-extrabold tracking-tight">Systems Architects</h2>
      <p class="text-gray-400 text-sm max-w-xl mx-auto">Core deployment engineering staff maintaining global platform state parameters.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-center" id="team-grid">
      
      <div class="glass-card rounded-2xl overflow-hidden border border-gray-800/60 transition-all duration-300 hover:-translate-y-2 flex flex-col justify-between shadow-xl">
        <div class="p-6 space-y-4">
          <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 p-1 mx-auto">
            <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center font-bold text-2xl text-indigo-400">DS</div>
          </div>
          <div class="text-center">
            <h3 class="text-xl font-bold tracking-wide">Dipak R Solanki</h3>
            <span class="text-xs uppercase tracking-widest text-indigo-400 font-semibold">Chief Architect & Founder</span>
          </div>
          <p class="text-gray-400 text-xs text-center leading-relaxed">
            Directs programmatic development expansion, end-to-end framework layout architecture, and decentralized ecosystem scaling operations.
          </p>
        </div>
        <div class="p-6 bg-slate-900/30 border-t border-gray-800/40 grid grid-cols-3 gap-2">
          <a href="https://github.com" target="_blank" class="py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-white text-center text-xs font-medium transition-colors"><i class="fab fa-github"></i> Hub</a>
          <a href="https://youtube.com" target="_blank" class="py-2 rounded-lg bg-red-600/20 text-red-400 hover:bg-red-600/30 text-center text-xs font-medium transition-colors"><i class="fab fa-youtube"></i> Sync</a>
          <a href="https://instagram.com" target="_blank" class="py-2 rounded-lg bg-pink-600/20 text-pink-400 hover:bg-pink-600/30 text-center text-xs font-medium transition-colors"><i class="fab fa-instagram"></i> Pulse</a>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
