<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingestion Terminal - StudyVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="global-loader" class="loader-container"><div class="spinner"></div></div>
  <header id="global-navbar"></header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-6 py-12">
    <div class="glass-card rounded-2xl p-8 border border-gray-800/60 shadow-2xl">
      <div class="flex space-x-6 border-b border-gray-800/80 pb-4 mb-6">
        <button id="trigger-note" class="text-sm font-semibold tracking-wide text-indigo-400 border-b-2 border-indigo-400 pb-2 focus:outline-none">Library Resource Asset</button>
        <button id="trigger-post" class="text-sm font-semibold tracking-wide text-gray-500 pb-2 focus:outline-none">Micro-Feed Post</button>
      </div>

      <div id="status-display" class="hidden mb-6 p-4 rounded-xl text-xs font-mono border"></div>

      <form id="form-upload-note" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Track Standard</label>
            <select id="note-std" class="w-full bg-slate-900 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
              <option>Standard 09</option><option>Standard 10</option><option>Standard 11 Science</option><option>Standard 12 Commerce</option>
            </select>
          </div>
          <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Target Module</label>
            <select id="note-sub" class="w-full bg-slate-900 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
              <option>Quantum Physics</option><option>Advanced Calculus</option><option>Organic Synthetics</option><option>Data Computing Structures</option>
            </select>
          </div>
          <div>
            <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Chapter Segment</label>
            <select id="note-ch" class="w-full bg-slate-900 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-indigo-500">
              <option>Segment 01: Core Paradigms & Architecture</option><option>Segment 02: Dynamic Synthesis Models</option><option>Segment 03: Field Quantization Execution</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Asset Title</label>
          <input type="text" id="note-title" required class="w-full bg-slate-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="E.g., Magnetic Field Derivations Blueprint">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Technical Description</label>
          <textarea id="note-desc" rows="3" required class="w-full bg-slate-900 border border-gray-800 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Provide deep contextual mapping parameters for this asset..."></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
          <div class="border border-dashed border-gray-800 rounded-xl p-4 text-center hover:border-indigo-500/50 transition-colors relative">
            <i class="fas fa-file-pdf text-xl text-red-400 mb-1"></i>
            <p class="text-[11px] font-medium text-gray-400">PDF Document Node</p>
            <input type="file" id="file-pdf" accept=".pdf" class="absolute inset-0 opacity-0 cursor-pointer">
          </div>
          <div class="border border-dashed border-gray-800 rounded-xl p-4 text-center hover:border-indigo-500/50 transition-colors relative">
            <i class="fas fa-video text-xl text-indigo-400 mb-1"></i>
            <p class="text-[11px] font-medium text-gray-400">Video Broadcast Asset</p>
            <input type="file" id="file-video" accept="video/*" class="absolute inset-0 opacity-0 cursor-pointer">
          </div>
          <div class="border border-dashed border-gray-800 rounded-xl p-4 text-center hover:border-indigo-500/50 transition-colors relative">
            <i class="fas fa-image text-xl text-pink-400 mb-1"></i>
            <p class="text-[11px] font-medium text-gray-400">Diagram Vector Graphic</p>
            <input type="file" id="file-img" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold tracking-wide text-sm shadow-lg shadow-indigo-500/10 transition-colors">Ingest Asset Payload</button>
      </form>

      <form id="form-upload-post" class="space-y-5 hidden">
        <div>
          <label class="block text-xs uppercase font-bold tracking-wider text-gray-400 mb-2">Feed Content Stream</label>
          <textarea id="post-text" rows="4" required class="w-full bg-slate-900 border border-gray-800 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Broadcast status updates, algorithmic insights, or discussion tokens..."></textarea>
        </div>
        <div class="border border-dashed border-gray-800 rounded-xl p-6 text-center hover:border-purple-500/50 transition-colors relative">
          <i class="fas fa-cloud-upload-alt text-2xl text-purple-400 mb-2"></i>
          <p class="text-xs font-semibold">Attach Media Payload File</p>
          <p class="text-[11px] text-gray-500 mt-0.5">Supports images, video streams, or audio elements</p>
          <input type="file" id="post-media" accept="image/*,video/*,audio/*" class="absolute inset-0 opacity-0 cursor-pointer">
        </div>
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white rounded-xl font-semibold tracking-wide text-sm shadow-lg transition-all">Broadcast Feed Packet</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/upload.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
