<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Module Breakdown - StudyVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex flex-col">
  <div id="global-loader" class="loader-container"><div class="spinner"></div></div>
  <header id="global-navbar"></header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-6 py-12 space-y-8">
    <div class="space-y-1">
      <div class="flex items-center space-x-2 text-xs font-mono text-gray-500">
        <a href="stds.html" class="hover:text-indigo-400 transition-colors">Vaults</a>
        <span>/</span>
        <a id="breadcrumb-std" class="hover:text-indigo-400 transition-colors">Standard</a>
        <span>/</span>
        <span id="breadcrumb-sub" class="text-gray-400">Subject</span>
      </div>
      <h2 class="text-3xl font-extrabold tracking-tight">Structured Segments</h2>
    </div>

    <div class="space-y-4" id="chapters-list-frame">
      <div class="text-gray-500 text-xs font-mono p-4">Isolating chapter metrics rows...</div>
    </div>
  </main>

  <script type="module">
    import { db } from "../firebase/config.js";
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.addEventListener("DOMContentLoaded", async () => {
      const URLParams = new URLSearchParams(window.location.search);
      const targetStd = URLParams.get("std") || "";
      const targetSub = URLParams.get("sub") || "";

      document.getElementById("breadcrumb-std").innerText = targetStd;
      document.getElementById("breadcrumb-std").href = `subject.html?std=${encodeURIComponent(targetStd)}`;
      document.getElementById("breadcrumb-sub").innerText = targetSub;

      try {
        const q = query(collection(db, "notes"), where("standard", "==", targetStd), where("subject", "==", targetSub));
        const snapshot = await getDocs(q);
        const frame = document.getElementById("chapters-list-frame");

        if (!snapshot.empty) {
          const uniqueChapters = new Set();
          snapshot.forEach(doc => uniqueChapters.add(doc.data().chapter));

          let bufferHtml = "";
          uniqueChapters.forEach(chapterTitle => {
            const encodedStd = encodeURIComponent(targetStd);
            const encodedSub = encodeURIComponent(targetSub);
            const encodedCh = encodeURIComponent(chapterTitle);
            bufferHtml += `
              <a href="material.html?std=${encodedStd}&sub=${encodedSub}&ch=${encodedCh}" class="glass-card p-5 rounded-xl border border-gray-800/60 hover:border-purple-500/40 flex items-center justify-between group transition-all block">
                <div class="flex items-center space-x-4">
                  <div class="w-8 h-8 rounded-lg bg-purple-500/10 flex items-center justify-center text-purple-400 text-xs font-mono font-bold"><i class="fas fa-folder"></i></div>
                  <span class="text-xs font-semibold text-gray-200 group-hover:text-purple-400 transition-colors">${chapterTitle}</span>
                </div>
                <i class="fas fa-arrow-right text-[10px] text-gray-600 group-hover:text-purple-400 group-hover:translate-x-1 transition-all"></i>
              </a>`;
          });
          frame.innerHTML = bufferHtml;
        } else {
          frame.innerHTML = `<div class="text-gray-500 text-xs font-mono p-4">No segment directories returned for active filters.</div>`;
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
