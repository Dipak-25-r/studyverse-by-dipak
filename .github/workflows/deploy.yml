name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change this to "master" if your primary branch is master

# ⬇️ This is the critical block that fixes the 401 Bad Credentials error ⬇️
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads your entire project root folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4