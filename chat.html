<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communications Matrix - StudyVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col h-screen overflow-hidden">
  <div id="global-loader" class="loader-container"><div class="spinner"></div></div>
  <header id="global-navbar"></header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6 h-[calc(100vh-80px)] overflow-hidden">
    <div class="w-full md:w-1/3 glass-card rounded-2xl border border-gray-800/60 p-4 flex flex-col overflow-y-auto">
      <h3 class="text-xs uppercase tracking-widest text-indigo-400 font-bold mb-4 px-2">Global Channels</h3>
      <div class="space-y-2">
        <div class="p-3.5 rounded-xl bg-indigo-600/10 border border-indigo-500/20 flex items-center space-x-3 cursor-pointer">
          <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white font-bold text-sm">#</div>
          <div>
            <h4 class="text-xs font-semibold">General Nexus Terminal</h4>
            <p class="text-[10px] text-gray-400">All-hands concurrent stream</p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex-grow w-full md:w-2/3 glass-card rounded-2xl border border-gray-800/60 flex flex-col justify-between h-full overflow-hidden">
      <div class="p-4 bg-slate-900/40 border-b border-gray-800/40 flex justify-between items-center">
        <div>
          <h4 class="text-sm font-bold tracking-wide"># General Nexus Terminal</h4>
          <span class="text-[10px] text-green-400 font-mono flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Active Transaction Mode</span>
        </div>
      </div>

      <div id="chat-messages-frame" class="flex-grow p-6 overflow-y-auto space-y-4 flex flex-col">
        <div class="text-center text-gray-500 text-xs my-auto">Connecting synchronization pipeline listeners...</div>
      </div>

      <form id="chat-dispatch-form" class="p-4 border-t border-gray-800/60 bg-slate-950/20 flex gap-3">
        <input type="text" id="chat-input-text" autocomplete="off" required class="flex-grow bg-slate-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Type transmission message packet details...">
        <button type="submit" class="w-12 h-12 rounded-xl bg-indigo-500 hover:bg-indigo-600 flex items-center justify-center transition-colors text-white focus:outline-none shadow-lg"><i class="fas fa-paper-plane text-sm"></i></button>
      </form>
    </div>
  </main>

  <script type="module" src="js/chat.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
